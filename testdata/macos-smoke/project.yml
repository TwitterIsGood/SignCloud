name: SignCloudMacSmoke
options:
  deploymentTarget:
    macOS: "14.0"
targets:
  SignCloudMacSmoke:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
    entitlements:
      path: SignCloudMacSmoke.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.signcloud.smoke.macos
        PRODUCT_NAME: SignCloudMacSmoke
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: SignCloud Mac Smoke
        ENABLE_HARDENED_RUNTIME: YES
schemes:
  SignCloudMacSmoke:
    shared: true
    build:
      targets:
        SignCloudMacSmoke: all
    run:
      config: Debug
    archive:
      config: Release
